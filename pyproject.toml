# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-grammar"
version = "0.1.0"
description = "Читаемые паттерны вместо регулярных выражений"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lark>=1.1.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
all = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pattern_grammar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pattern_grammar --cov-report=term-missing --cov-report=xml -v"
required_plugins = ["pytest-cov>=4.0.0"]

[tool.coverage.run]
source = ["pattern_grammar"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
fail_under = 0

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
